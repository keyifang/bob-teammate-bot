{
  "services": [
    {
      "type": "web",
      "name": "bob-teammate-bot",
      "runtime": "docker",
      "repo": "https://github.com/keyifang/bob-teammate-bot",
      "plan": "free",
      "branch": "main",
      "dockerfilePath": "./Dockerfile",
      "dockerContext": ".",
      "healthCheckPath": "/health",
      "envVars": [
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "MODEL_API_URL",
          "value": "https://openrouter.ai/api/v1/chat/completions"
        },
        {
          "key": "MODEL_NAME",
          "value": "nvidia/nemotron-3-ultra-550b-a55b:free"
        },
        {
          "key": "BOB_NAME",
          "value": "Bob"
        },
        {
          "key": "BOB_USERNAME",
          "value": "bob_friendly_ai_bot"
        },
        {
          "key": "HUMANIZE",
          "value": "true"
        },
        {
          "key": "PGPOOL_MAX",
          "value": "5"
        },
        {
          "key": "RELAY_MAX_BOTS",
          "value": "3"
        },
        {
          "key": "OVERLOAD_MAX_ATTEMPTS",
          "value": "5"
        },
        {
          "key": "OVERLOAD_BASE_DELAY_MS",
          "value": "1500"
        },
        {
          "key": "REPLY_MAX_TOKENS",
          "value": "2000"
        },
        {
          "key": "SUMMARY_MAX_TOKENS",
          "value": "4000"
        },
        {
          "key": "RECENT_MESSAGE_WINDOW",
          "value": "10"
        },
        {
          "key": "SUMMARY_TRIGGER_BUFFER",
          "value": "30"
        },
        {
          "key": "PYTHON_BIN",
          "value": "python3"
        },
        {
          "key": "TELEGRAM_BOT_TOKEN",
          "sync": false
        },
        {
          "key": "MODEL_API_KEY",
          "sync": false
        },
        {
          "key": "DATABASE_URL",
          "sync": false
        },
        {
          "key": "WEBHOOK_SECRET",
          "sync": false
        }
      ]
    }
  ]
}